<svg xmlns="http://www.w3.org/2000/svg" width="160" height="400" viewBox="0 0 160 400">
  <!-- Five 160 x 80 nine-slice states: normal, hover, pressed, disabled, focus.
       The 16 px transparent gutter holds the halo outside the clickable surface. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253449" stop-opacity=".4"/>
      <stop offset=".52" stop-color="#111b2b" stop-opacity=".4"/>
      <stop offset="1" stop-color="#3a3029" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd46c"/>
      <stop offset=".5" stop-color="#ffc04b"/>
      <stop offset="1" stop-color="#f0a82d"/>
    </linearGradient>
    <radialGradient id="innerLight" cx=".5" cy=".58" r=".62">
      <stop offset="0" stop-color="#ffc04b" stop-opacity=".075"/>
      <stop offset=".65" stop-color="#ffc04b" stop-opacity=".025"/>
      <stop offset="1" stop-color="#ffc04b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(0 0)" fill="none"> <!-- normal -->
<rect x="16" y="16" width="128" height="48" rx="24" fill="url(#glass)"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#d2ad8b" stroke-width="1.3"/>
  </g>
  <g transform="translate(0 80)" fill="none"> <!-- hover -->
<rect x="16" y="16" width="128" height="48" rx="24" fill="url(#glass)"/>
<rect x="16" y="16" width="128" height="48" rx="24" fill="url(#innerLight)"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="28" stroke-opacity="0.0191"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="22" stroke-opacity="0.0285"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="16" stroke-opacity="0.0476"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="8" stroke-opacity="0.0794"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="5" stroke-opacity="0.1428"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="url(#amber)" stroke-width="1.8"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffe3a0" stroke-width=".6" stroke-opacity=".65"/>
  </g>
  <g transform="translate(0 160)" fill="none"> <!-- pressed -->
<rect x="16" y="16" width="128" height="48" rx="24" fill="url(#glass)"/>
<rect x="16" y="16" width="128" height="48" rx="24" fill="url(#innerLight)"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="28" stroke-opacity="0.0124"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="22" stroke-opacity="0.0185"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="16" stroke-opacity="0.0309"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="8" stroke-opacity="0.0515"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="5" stroke-opacity="0.0928"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="url(#amber)" stroke-width="1.8"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffe3a0" stroke-width=".6" stroke-opacity=".65"/>
  </g>
  <g transform="translate(0 240)" fill="none"> <!-- disabled -->
<rect x="16" y="16" width="128" height="48" rx="24" fill="url(#glass)"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#667080" stroke-width="1.2" stroke-opacity=".7"/>
  </g>
  <g transform="translate(0 320)" fill="none"> <!-- focus -->
<rect x="16" y="16" width="128" height="48" rx="24" fill="url(#innerLight)"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="28" stroke-opacity="0.0191"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="22" stroke-opacity="0.0285"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="16" stroke-opacity="0.0476"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="8" stroke-opacity="0.0794"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffb62e" stroke-width="5" stroke-opacity="0.1428"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="url(#amber)" stroke-width="1.8"/>
<rect x="16" y="16" width="128" height="48" rx="24" stroke="#ffe3a0" stroke-width=".6" stroke-opacity=".65"/>
  </g>
</svg>
